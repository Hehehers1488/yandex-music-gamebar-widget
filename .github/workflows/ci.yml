name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    name: Build (${{ matrix.arch }})
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        arch: [x64, arm64]

    steps:
      - uses: actions/checkout@v4

      - name: Locate MSBuild (UWP workload)
        id: msbuild
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          if (-not (Test-Path $vswhere)) { Write-Error "vswhere not found"; exit 1 }
          $msbuild = & $vswhere -latest -products * `
            -requires Microsoft.VisualStudio.ComponentGroup.UWP.BuildTools `
            -find MSBuild\**\Bin\MSBuild.exe | Select-Object -First 1
          if (-not $msbuild) { Write-Error "UWP Build Tools not installed on this runner"; exit 1 }
          Write-Host "MSBuild: $msbuild"
          "msbuild=$msbuild" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Restore
        shell: pwsh
        run: |
          & "${{ steps.msbuild.outputs.msbuild }}" `
            src\YMusicGameBarWidget\YMusicGameBarWidget.csproj `
            /t:Restore `
            /p:Configuration=Release /p:Platform=${{ matrix.arch }} `
            /p:RestorePackagesConfig=true

      - name: Build (unsigned validation package)
        shell: pwsh
        run: |
          & "${{ steps.msbuild.outputs.msbuild }}" `
            src\YMusicGameBarWidget\YMusicGameBarWidget.csproj `
            /t:Build `
            /p:Configuration=Release /p:Platform=${{ matrix.arch }} `
            /p:AppxPackageSigningEnabled=false `
            /p:UapAppxPackageBuildMode=SideloadOnly `
            /p:AppxPackageDir="${{ runner.temp }}\AppPackages" `
            /p:AppxBundle=Never `
            /p:GenerateAppxPackageOnBuild=true

      - name: Upload MSIX artifact
        uses: actions/upload-artifact@v4
        with:
          name: msix-${{ matrix.arch }}
          path: ${{ runner.temp }}\AppPackages\**\*.msix
          if-no-files-found: error
